# 60 interiors: 12 room types x 5 distinct designs.
# Long category briefs carry constraints through the existing category planner.
"Reading room interiors. Required program: reading chairs, populated bookshelves, side tables, reading lamps and a distinct reading focal point. SINGLE-ROOM INTERIOR ONLY. Each scene contains exactly one rectangular room_shell with exactly one explicit furnished room brief and a single floor, optionally resting on one plain supporting slab. No additional rooms, buildings, wings, corridors, courtyards, bridges, towers, landscape or exterior scene. This is a room-scale interior, not a whole architectural structure: spend detail on furniture and surfaces rather than adding 12-28 exterior assemblies. Choose clear interior dimensions roughly 6-9 metres by 5-8 metres and 2.8-3.6 metres high; enlarge the shell to preserve wall and ceiling clearance. Allocate furniture through the dedicated room furnishing pass, not the macro layout. Request 12-18 purposeful furniture and decor components, including at least four functional furniture pieces, with detailed supported small props, plausible dimensions, usable spacing and one appropriate circulation route. Prioritize interior eye-level views, visible furnishings, layered lighting, coherent material finishes and tactile textiles. Every prompt must repeat the exactly-one-room requirement. Across the five scenes invent different furniture arrangements, focal points, proportions, styles, palettes and lighting moods; do not vary only colors. Diversity is interior composition and function, not exterior terrain or building silhouette.": 5
