<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Loop Scene Inspector</title><style>html,body,#view{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font:13px system-ui}#panel{position:fixed;z-index:2;top:12px;left:12px;width:300px;max-height:calc(100% - 24px);overflow:auto;background:#171a1fcc;padding:12px;border:1px solid #39414d;border-radius:8px}button,select,input{width:100%;margin:4px 0;background:#252b33;color:#eee;border:1px solid #4a5563;padding:6px}#status{white-space:pre-wrap;color:#b9c6d8}.error{color:#ff8585}</style></head><body><div id="panel"><b>Loop scene inspector</b><input id="file" type="file" accept=".glb"><select id="camera"><option value="iso">Three-quarter</option><option value="north">North (+Y plan / -Z glTF)</option><option value="top">Canonical overhead (+Z)</option></select><select id="nodes"><option>Select node</option></select><button id="fit">Fit selection</button><div id="status">Choose final/scene.glb or pass ?scene=/path served by Vite.</div></div><div id="view"></div><script type="module" src="/src.js"></script></body></html>
